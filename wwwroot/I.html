<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إشعارات المواطن (ID: 2)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.0/signalr.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        #notifications { list-style: none; padding: 0; }
        .notification { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .success { border-left: 5px solid green; color: green; }
        .error { border-left: 5px solid red; color: red; }
        .warning { border-left: 5px solid orange; color: orange; }
        .info { border-left: 5px solid #007bff; color: #007bff; }
    </style>
</head>
<body>
    <h1>مركز إشعارات المواطن - التجربة</h1>
    <div id="connection-status">حالة الاتصال: جاري الاتصال...</div>
    <ul id="notifications"></ul>

    <script>
        // 🔑 ضع التوكن الصحيح هنا
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJodHRwOi8vc2NoZW1hcy54bWxzb2FwLm9yZy93cy8yMDA1LzA1L2lkZW50aXR5L2NsYWltcy9uYW1laWRlbnRpZmllciI6IjgiLCJodHRwOi8vc2NoZW1hcy54bWxzb2FwLm9yZy93cy8yMDA1LzA1L2lkZW50aXR5L2NsYWltcy9lbWFpbGFkZHJlc3MiOiJtYXJpYW1hYWppNDQyQGdtYWlsLmNvbSIsImh0dHA6Ly9zY2hlbWFzLm1pY3Jvc29mdC5jb20vd3MvMjAwOC8wNi9pZGVudGl0eS9jbGFpbXMvcm9sZSI6IkNpdGl6ZW4iLCJleHAiOjE3Njc5MTc4NDYsImlzcyI6Ik15QXBwIiwiYXVkIjoiTXlBcHBVc2VycyJ9.B3AY67h3SOdINsyyGcG101KomKZe4RD-xhODqgL8cv8";

        // بناء الاتصال مع الـ Hub
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("https://localhost:44353/complainthub", {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // استقبال إشعار من السيرفر
        connection.on("ComplaintStatusChanged", (data) => {
            addNotification("📩 طلب معلومات إضافية للشكوى رقم " + data.complaintId + ": " + data.message, "info");
        });

        // دالة إضافة إشعار للقائمة مع نوع الحالة
        function addNotification(msg, type) {
            const li = document.createElement("li");
            li.className = "notification " + type;
            li.innerHTML = msg + "<br><small>" + new Date().toLocaleTimeString() + "</small>";
            document.getElementById("notifications").prepend(li);
        }

        // أحداث الاتصال
        connection.onreconnecting(error => {
            addNotification("🔄 إعادة الاتصال...", "warning");
        });

        connection.onreconnected(connectionId => {
            addNotification("✅ أعيد الاتصال بنجاح", "success");
        });

        connection.onclose(error => {
            addNotification("❌ الاتصال مغلق", "error");
        });
document.getElementById("connection-status").innerText = "بانتظار تأكيد الاتصال (202)...";

connection.start()
    .then(() => {
        addNotification("✅ الاتصال اكتمل (200 OK)", "success");
        document.getElementById("connection-status").innerText = "حالة الاتصال: متصل بنجاح ✅";
        document.getElementById("connection-status").style.color = "green";
    })
    .catch(err => {
        addNotification("❌ فشل الاتصال", "error");
        document.getElementById("connection-status").innerText = "فشل الاتصال ❌";
        document.getElementById("connection-status").style.color = "red";
        console.error("خطأ في الاتصال:", err);
    });
        // بدء الاتصال
   
    </script>
</body>
</html>

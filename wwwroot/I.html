<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إشعارات المواطن (ID: 2)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.0/signalr.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        #notifications { list-style: none; padding: 0; }
        .notification { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #007bff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .status-badge { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <h1>مركز إشعارات المواطن - التجربة</h1>
    <div id="connection-status">حالة الاتصال: جاري الاتصال...</div>
    <ul id="notifications"></ul>

    <script>
        // ضع التوكن الخاص بالمواطن رقم 2 هنا
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJodHRwOi8vc2NoZW1hcy54bWxzb2FwLm9yZy93cy8yMDA1LzA1L2lkZW50aXR5L2NsYWltcy9uYW1laWRlbnRpZmllciI6IjIiLCJodHRwOi8vc2NoZW1hcy54bWxzb2FwLm9yZy93cy8yMDA1LzA1L2lkZW50aXR5L2NsYWltcy9lbWFpbGFkZHJlc3MiOiJsYW5hbWFraG91c2gxOUBnbWFpbC5jb20iLCJodHRwOi8vc2NoZW1hcy5taWNyb3NvZnQuY29tL3dzLzIwMDgvMDYvaWRlbnRpdHkvY2xhaW1zL3JvbGUiOiJDaXRpemVuIiwiZXhwIjoxNzY3NTc5MTM2LCJpc3MiOiJNeUFwcCIsImF1ZCI6Ik15QXBwVXNlcnMifQ.quEloL2EGTej5h86LJQtVmcKIQHlvxyl5-58QaXTk5k"; 

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("https://localhost:44352/complaintHub", {
                accessTokenFactory: () => token
            })
            .withAutomaticReconnect()
            .build();

        connection.on("AdditionalInfoRequested", (data) => {
            addNotification("طلب معلومات إضافية للشكوى رقم " + data.complaintId + ": " + data.message);
        });

        function addNotification(msg) {
            const li = document.createElement("li");
            li.className = "notification";
            li.innerHTML = msg + "<br><small>" + new Date().toLocaleTimeString() + "</small>";
            document.getElementById("notifications").prepend(li);
        }

        connection.start()
            .then(() => {
                document.getElementById("connection-status").innerText = "حالة الاتصال: متصل بنجاح ✅";
                document.getElementById("connection-status").style.color = "green";
            })
            .catch(err => {
                document.getElementById("connection-status").innerText = "فشل الاتصال ❌";
                console.error(err);
            });
    </script>
</body>
</html>
